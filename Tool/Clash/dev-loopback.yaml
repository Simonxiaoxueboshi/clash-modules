# 本机开发服务回环（Clash App 版）
# 等价于 Loon dev-loopback 模块的 [IP Rewrite] 10.7.0.1 = reflect（把发往 10.7.0.1 的连接弹回本机）。
#
# 注意：Clash 模块不支持 tun 段（已在 App 实测：作为模块导入后，tun 被标为「不支持这种写法，已跳过」），
# 所以这不是模块，必须手动合并进当前配置源码的 tun: 段（配置页 › 编辑源码；已有 tun: 段就并进去，别写两个 tun:），
# 保存后断开 Clash 再重连。
#
# 不要加 route-address：它会替换默认路由，导致隧道只收 10.7.0.1，其余流量不再进隧道。
# 若 App 报格式错，把 10.7.0.1 改成 10.7.0.1/32。
# 来源：https://clash.md/zh/guide/config/inbound （loopback-address）

tun:
  loopback-address:
    - 10.7.0.1

ipv6: false   # 对应原模块的 ipv6-vif=off，可选
