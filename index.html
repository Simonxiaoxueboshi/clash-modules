<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>clash-modules</title>
<style>
body{font:15px -apple-system,sans-serif;max-width:640px;margin:0 auto;padding:16px;color:#222}
@media(prefers-color-scheme:dark){body{background:#111;color:#eee}li{border-color:#333!important}}
ul{list-style:none;padding:0}
li{display:flex;align-items:center;gap:8px;border-bottom:1px solid #ddd;padding:8px 0}
li a{flex:1;display:flex;gap:10px;align-items:center;color:inherit;text-decoration:none}
img{width:40px;height:40px;border-radius:9px;flex:none}
span{display:flex;flex-direction:column}
small{color:#888}
button{font-size:12px;padding:4px 8px}
#status{color:#888}
</style>
<h1>clash-modules</h1>
<p>点插件名会打开 Clash 并填好链接，再点「添加」。已经装过的不用重复添加。列表直接读取仓库，增删插件后刷新本页即可。</p>
<p id="status">正在读取仓库…</p>
<ul id="list"></ul>
<script>
const REPO = "Simonxiaoxueboshi/clash-modules";
const DIR = "Tool/Clash";
const RAW = `https://raw.githubusercontent.com/${REPO}/main/`;
const status = document.getElementById("status");
const list = document.getElementById("list");

function parseMeta(text) {
  const meta = {};
  for (const line of text.split("\n")) {
    if (!line.startsWith("#!")) break;
    const i = line.indexOf("=");
    if (i > 2) meta[line.slice(2, i)] = line.slice(i + 1).trim();
  }
  return meta;
}

function row(file, meta) {
  const url = RAW + DIR + "/" + file;
  const li = document.createElement("li");
  const a = document.createElement("a");
  a.href = "hako://install-module?url=" + encodeURIComponent(url);
  const img = document.createElement("img");
  img.alt = "";
  if (meta.icon) img.src = meta.icon;
  const span = document.createElement("span");
  const b = document.createElement("b");
  b.textContent = meta.name || file;
  const small = document.createElement("small");
  small.textContent = meta.desc || "";
  span.append(b, small);
  a.append(img, span);
  const btn = document.createElement("button");
  btn.textContent = "复制链接";
  btn.onclick = () => navigator.clipboard.writeText(url).then(() => (btn.textContent = "已复制"));
  li.append(a, btn);
  return li;
}

async function load() {
  // 用最新提交的 SHA 取文件，绕开 raw 的 5 分钟缓存
  const head = await fetch(`https://api.github.com/repos/${REPO}/commits/main`, { cache: "no-store" });
  if (!head.ok) throw new Error("GitHub API " + head.status);
  const sha = (await head.json()).sha;
  const res = await fetch(`https://api.github.com/repos/${REPO}/contents/${DIR}?ref=${sha}`, { cache: "no-store" });
  if (!res.ok) throw new Error("GitHub API " + res.status);
  const files = (await res.json())
    .filter(f => f.type === "file" && /\.(lpx|plugin)$/i.test(f.name))
    .map(f => f.name)
    .sort((x, y) => x.localeCompare(y));
  const metas = await Promise.all(files.map(async f => {
    const r = await fetch(`https://raw.githubusercontent.com/${REPO}/${sha}/${DIR}/${encodeURIComponent(f)}`);
    return r.ok ? parseMeta(await r.text()) : {};
  }));
  list.replaceChildren(...files.map((f, i) => row(f, metas[i])));
  status.textContent = `共 ${files.length} 个插件`;
}

load().catch(e => { status.textContent = "读取仓库失败：" + e.message + "，稍后刷新重试。"; });
</script>
</html>
